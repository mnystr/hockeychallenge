name: Apply Supabase migrations

# Pushes to `dev` migrate the dev Supabase project. Pushes to `main` migrate
# prod. We trigger only when migration files (or this workflow itself) change,
# so cosmetic commits don't burn CI minutes. workflow_dispatch lets you re-run
# manually if a previous run failed.

on:
  push:
    branches: [main, dev]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/migrate.yml'
  workflow_dispatch:

concurrency:
  # Don't let two runs against the same environment race. A second push to
  # the same branch waits for the first to finish.
  group: supabase-migrate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push migrations to PROD
        if: github.ref == 'refs/heads/main'
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_PROD_DB_PASSWORD }}
        run: |
          supabase link --project-ref "${{ secrets.SUPABASE_PROD_PROJECT_REF }}"
          supabase db push

      - name: Push migrations to DEV
        if: github.ref == 'refs/heads/dev'
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DEV_DB_PASSWORD }}
        run: |
          supabase link --project-ref "${{ secrets.SUPABASE_DEV_PROJECT_REF }}"
          supabase db push
